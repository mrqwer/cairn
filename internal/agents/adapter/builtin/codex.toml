# Codex assigns its own session id; cairn discovers it after launch (directory
# diff / start time) and keeps the conversation name itself.
name = "codex"
binary = "codex"
version_check = ["codex", "--version"]
# Help commands `cairn agents doctor` reads to check the flags used exist.
probe_flags = [["codex", "--help"], ["codex", "resume", "--help"]]

[capabilities]
resume_by_id = true
hooks = "config-override"
discovery = "dir-diff"

[commands]
start = ["codex", "{profile_args...}"]
resume = ["codex", "resume", "{native_id}", "{profile_args...}"]

[profile_flags]
model = ["--model", "{value}"]
permission_mode = ["--ask-for-approval", "{value}"]

[history]
locator = "~/.codex/sessions/*/*/*/*-{native_id}.jsonl"
parser = "codex-jsonl@1"

# Per-process override `-c notify=[...]`: codex runs the program when a turn
# completes (it appends a JSON payload, which cairn event ignores). It
# replaces a notify program from the user's config for this process only.
[hooks]
flag = "-c"
key = "notify"
kind = "idle"
