# agy has no conversation names; cairn keeps them. The id is read from the
# tool's conversation store after launch.
name = "agy"
binary = "agy"
version_check = ["agy", "--version"]

[capabilities]
resume_by_id = true
hooks = "none"
discovery = "state-file"

[commands]
start = ["agy", "{profile_args...}"]
resume = ["agy", "--conversation", "{native_id}", "{profile_args...}"]

[profile_flags]
model = ["--model", "{value}"]
