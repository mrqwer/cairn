name = "claude"
binary = "claude"
version_check = ["claude", "--version"]

[capabilities]
name_at_start = true
preassign_id = true
resume_by_id = true
resume_by_name = true
fork = true
list_json = true
hooks = "settings-file"

[commands]
start = ["claude", "--session-id", "{id}", "--name", "{name}", "{profile_args...}"]
resume = ["claude", "--resume", "{id}", "{profile_args...}"]
fork = ["claude", "--resume", "{id}", "--fork-session", "--session-id", "{new_id}"]
list = ["claude", "agents", "--json", "--all"]

[profile_flags]
model = ["--model", "{value}"]
effort = ["--effort", "{value}"]
permission_mode = ["--permission-mode", "{value}"]

[env]
unset = ["ANTHROPIC_API_KEY"]

[history]
locator = "~/.claude/projects/*/{native_id}.jsonl"
parser = "claude-jsonl@1"

# Hooks go in a cairn-owned settings file passed with --settings at launch;
# the user's own ~/.claude settings are never edited. Each event runs
# `cairn event --conversation <id> --kind <kind>`.
[hooks]
flag = "--settings"
format = "claude-settings@1"

[hooks.events]
SessionStart = "ready"
UserPromptSubmit = "working"
PostToolUse = "working"
Notification = "waiting"
Stop = "idle"
SessionEnd = "stopped"
